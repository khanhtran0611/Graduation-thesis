<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./password_reset.css" />
  </head>
  <body>
    <div class="modal-overlay" id="editEmployeeModal">
      <div class="modal-container">
        <div class="modal-header">
          <h3 class="modal-title">Edit Employee Info</h3>
          <button
            class="btn-close-modal"
            id="closeEmployeeModalBtn"
            title="Close"
          >
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Temporary password</label>
            <input
              type="password"
              value="061104"
              placeholder="Enter new password"
            />
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="cancelEmployeeBtn">Cancel</button>
          <button class="btn-primary" id="saveEmployeeBtn">Save Changes</button>
        </div>
      </div>
    </div>
  </body>
</html>

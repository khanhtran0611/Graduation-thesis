<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="exam-modal.css" />
  </head>
  <body>
    <div class="modal-overlay-nexam">
      <div class="modal-content-nexam">
        <div class="modal-header-nexam">
          <h2 class="modal-title-nexam">Fill in additional exam details</h2>
        </div>

        <div class="modal-body-nexam">
          <div class="form-group-nexam">
            <label class="label-nexam" for="exam-name">Exam Name:</label>
            <input
              type="text"
              id="exam-name"
              class="input-field-nexam"
              placeholder="Enter exam title..."
            />
          </div>

          <div class="form-group-nexam">
            <label class="label-nexam" for="exam-duration"
              >Duration (minutes):</label
            >
            <input
              type="number"
              id="exam-duration"
              class="input-field-nexam"
              placeholder="e.g. 60, 90, 120..."
            />
          </div>
        </div>

        <div class="modal-footer-nexam">
          <button class="btn-cancel-nexam">Cancel</button>
          <button class="btn-save-nexam">Save Exam</button>
        </div>
      </div>
    </div>
  </body>
</html>

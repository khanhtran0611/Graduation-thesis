<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Modal</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="error-modal.css" />
  </head>
  <body>
    <div class="modal-overlay" id="error-modal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="material-symbols-rounded modal-icon icon-error"
            >error</span
          >
          <h3 class="modal-title">Generation Failed</h3>
        </div>

        <div class="modal-body">
          <p class="modal-message">
            An unexpected error occurred while saving to the database. Please
            check your connection and try again.
          </p>
        </div>

        <div class="modal-footer">
          <button class="modal-close-btn">Close</button>
        </div>
      </div>
    </div>
  </body>
</html>

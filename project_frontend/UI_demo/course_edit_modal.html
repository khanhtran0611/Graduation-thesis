<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./course_edit_modal.css" />
  </head>
  <body>
    <div class="modal-overlay" id="editCourseModal">
      <div class="modal-container">
        <div class="modal-header">
          <h3 class="modal-title">Edit Course Info</h3>
          <button
            class="btn-close-modal"
            id="closeCourseModalBtn"
            title="Close"
          >
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label>Course Code</label>
              <input type="text" value="DSA201" placeholder="e.g., IT1110" />
            </div>
            <div class="form-group">
              <label>Credits</label>
              <input type="number" value="4" min="1" max="10" />
            </div>
          </div>

          <div class="form-group">
            <label>Course Name</label>
            <input type="text" value="Data Structures & Algorithms" />
          </div>

          <div class="form-group">
            <label>Department</label>
            <select>
              <option>Information Technology</option>
              <option selected>Software Engineering</option>
              <option>Computer Networks</option>
              <option>Information Systems</option>
            </select>
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea rows="4" placeholder="Enter course description...">
Learn core data storage structures and essential algorithms in modern software programming.</textarea
            >
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="cancelCourseBtn">Cancel</button>
          <button class="btn-primary" id="saveCourseBtn">Save Changes</button>
        </div>
      </div>
    </div>
  </body>
</html>

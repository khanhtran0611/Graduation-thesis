<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Dashboard - Exam View</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />

      rel="stylesheet"
    />

    <link rel="stylesheet" href="./exam_detail_new.css" />

  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <span class="material-symbols-rounded">menu</span>
        </div>
        <nav class="sidebar-nav">
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded nav-icon">dashboard</span>
            <span class="nav-text">DASHBOARD</span>
          </a>
          <a href="#" class="nav-item active">
            <span class="material-symbols-rounded nav-icon">menu_book</span>
            <span class="nav-text">COURSES</span>
          </a>
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded nav-icon">quiz</span>
            <span class="nav-text">QUESTION BANK</span>
          </a>
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded nav-icon">person</span>
            <span class="nav-text">PROFILE</span>
          </a>
          <a href="#" class="nav-item">
            <span class="material-symbols-rounded nav-icon">settings</span>
            <span class="nav-text">SETTINGS</span>
          </a>
        </nav>
      </aside>

            <div class="brand-icon-box">
              <span class="material-symbols-rounded">edit_document</span>
            </div>
            <div class="brand-text-box">
              <h2 class="brand-name">Edu<span>Grade</span></h2>
              <span class="brand-slogan">Hệ thống Quản lý & Chấm thi</span>
            </div>
          </div>

          <div class="profile-container">
            <div class="profile-info">
              <h2>Igor Brown</h2>
              <p>Developer</p>
            </div>
            <div class="profile-card">
              <input accept="image/png, image/jpeg" name="avatar" type="file" />

                  </svg>
                </a>
              </main>
              <span class="badge-check">
                <svg
                  stroke="currentColor"
                  fill="currentColor"
                  stroke-width="0"
                  viewBox="0 0 512 512"
                  height="8"
                  width="8"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M173.898 439.404l-166.4-166.4c-9.997-9.997-9.997-26.206 0-36.204l36.203-36.204c9.997-9.998 26.207-9.998 36.204 0L192 312.69 432.095 72.596c9.997-9.997 26.207-9.997 36.204 0l36.203 36.204c9.997 9.997 9.997 26.206 0 36.204l-294.4 294.401c-9.998 9.997-26.207 9.997-36.204-.001z"
                  />
                </svg>
              </span>
            </div>
          </div>
        </header>

        <div class="page-content exam-view-layout">
          <div class="exam-paper-container pdf-mode">
            <iframe
              id="pdf-viewer"
              class="pdf-iframe"
              src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
              title="LaTeX PDF Preview"
            >
            </iframe>
          </div>

          <div class="floating-action-panel">
            <div class="action-grid">
              <button
                class="action-btn icon-btn info-btn"
                title="Thông tin Đề thi"
                onclick="openInfoModal()"
              >
                <span class="material-symbols-rounded">info</span>
              </button>

              <button
                class="action-btn icon-btn pdf-btn"
                title="Xuất PDF"
                onclick="window.print()"
              >
                <span class="material-symbols-rounded">download</span>
              </button>

              <button class="action-btn icon-btn delete-btn" title="Xóa Đề thi">
                <span class="material-symbols-rounded">delete</span>
              </button>
            </div>

            <button class="action-btn compile-btn">
              <span class="material-symbols-rounded">build</span>
              Compile LaTeX
            </button>

            <div class="settings-panel">
              <div class="setting-row">
                <span class="setting-label">Answers</span>
                <label class="switch">
                  <input type="checkbox" id="toggle-answers" checked />
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-divider"></div>
              <div class="setting-row">
                <span class="setting-label">Layout</span>
                <div class="segmented-control">
                  <input
                    type="radio"
                    id="layout-single"
                    name="layout"
                    value="single"
                  />
                  <label for="layout-single">Single</label>
                  <input
                    type="radio"
                    id="layout-double"
                    name="layout"
                    value="double"
                    checked
                  />
                  <label for="layout-double">Double</label>
                  <div class="segment-highlight"></div>
                </div>
              </div>
            </div>

            <div class="generate-group">
              <button class="action-btn generate-btn">
                <span class="material-symbols-rounded">shuffle</span>
                Generate Codes
              </button>
              <div class="generate-input-box">
                <label for="variant-count">Quantity:</label>
                <input
                  type="number"
                  id="variant-count"
                  class="qty-input"
                  min="1"
                  max="20"
                  value="4"
                />
              </div>
            </div>

            <div class="existing-codes-panel">
              <div class="panel-header">Generated Variants</div>
              <div class="codes-list">
                <button class="code-item">
                  <span class="material-symbols-rounded">description</span>
                  Code 401
                </button>
                <button class="code-item active">
                  <span class="material-symbols-rounded">description</span>
                  Code 402
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>

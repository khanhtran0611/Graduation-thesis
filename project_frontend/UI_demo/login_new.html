<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - EduAdmin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./login_new.css" />
  </head>
  <body class="auth-layout">
    <div class="auth-container">
      <div class="auth-header">
        <div class="system-brand">
          <div class="brand-icon-box">
            <span
              class="material-symbols-rounded"
              style="color: white; font-size: 24px"
              >edit_document</span
            >
          </div>
          <div class="brand-text-box">
            <h2 class="brand-name">Edu<span>Admin</span></h2>
            <span class="brand-slogan">Question and Exam Management</span>
          </div>
        </div>
      </div>

      <div class="auth-body">
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="e.g. name@company.com" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label>Role</label>
          <select class="custom-select" required>
            <option value="user" selected>User</option>
            <option value="administrator">Administrator</option>
          </select>
        </div>
      </div>

      <div class="auth-footer">
        <button class="btn-primary" id="loginBtn">Sign In</button>
        <p class="signup-prompt">
          Don't have an account or forgot password?
          <a href="#">Contact Admin</a>
        </p>
      </div>
    </div>
  </body>
</html>

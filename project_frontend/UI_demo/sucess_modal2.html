<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success Notification</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="success-modal2.css" />
  </head>
  <body>
    <div class="modal-content" id="success-notification">
      <button class="close-icon-btn" aria-label="Close">
        <span class="material-symbols-rounded">close</span>
      </button>

      <div class="modal-header">
        <span class="material-symbols-rounded modal-icon">check_circle</span>
        <h3 class="modal-title">Successfully Generated</h3>
      </div>

      <div class="modal-body">
        <p class="modal-message">
          4 exam variants have been successfully created and saved to the
          database.
        </p>
      </div>
    </div>
  </body>
</html>

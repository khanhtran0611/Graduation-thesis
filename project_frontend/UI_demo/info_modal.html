<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Information Modal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./info_modal.css" />
  </head>
  <body>
    <div class="modal-overlay" id="infoModal">
      <div class="modal-container">
        <div class="modal-header">
          <div class="header-left">
            <span class="material-symbols-rounded info-icon">info</span>
            <h3 class="modal-title">Information message</h3>
          </div>
          <button class="btn-close-modal" title="Close">
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>

        <div class="modal-body">
          <p class="info-text">
            Your changes have been saved successfully. The system has updated
            the course information and notified the department head.
          </p>
        </div>

        <div class="modal-footer">
          <button class="btn-primary">Acknowledge</button>
        </div>
      </div>
    </div>
  </body>
</html>

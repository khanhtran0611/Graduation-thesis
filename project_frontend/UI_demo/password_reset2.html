<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./password_reset2.css" />
  </head>
  <body class="auth-layout">
    <div class="auth-container">
      <div class="auth-header">
        <div class="system-brand">
          <div class="brand-icon-box">
            <span
              class="material-symbols-rounded"
              style="color: white; font-size: 24px"
              >edit_document</span
            >
          </div>
          <div class="brand-text-box">
            <h2 class="brand-name">Edu<span>Admin</span></h2>
            <span class="brand-slogan">Question and Exam Management</span>
          </div>
        </div>
      </div>
      <div class="auth-body">
        <h3 class="auth-subtitle">
          You have already entered a temporary password, please enter a new
          password
        </h3>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" placeholder="Enter new password..." />
        </div>

        <div class="form-group">
          <label>Repeat Password</label>
          <input type="password" placeholder="Repeat new password..." />
        </div>
      </div>

      <div class="auth-footer">
        <button class="btn-primary" id="changePasswordBtn">
          Confirm Change
        </button>
      </div>
    </div>
  </body>
</html>

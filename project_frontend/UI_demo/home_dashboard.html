<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Dashboard</title>
    <link rel="stylesheet" href="./home_dashboard.css" />
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <h1 class="dashboard-title">Assessment workspace</h1>
      </header>

      <section class="dashboard-grid" aria-label="Dashboard menu">
        <article
          class="dashboard-card"
          role="button"
          tabindex="0"
          aria-label="Tests"
        >
          <span class="card-pill">Tests</span>
          <h2 class="card-title">Create & manage tests</h2>
        </article>

        <article
          class="dashboard-card"
          role="button"
          tabindex="0"
          aria-label="Question bank"
        >
          <span class="card-pill">Question bank</span>
          <h2 class="card-title">Browse question library</h2>
        </article>

        <article
          class="dashboard-card"
          role="button"
          tabindex="0"
          aria-label="Results"
        >
          <span class="card-pill">Results</span>
          <h2 class="card-title">Review submissions</h2>
        </article>

        <article
          class="dashboard-card"
          role="button"
          tabindex="0"
          aria-label="Settings"
        >
          <span class="card-pill">Settings</span>
          <h2 class="card-title">Test policies & pools</h2>
        </article>
      </section>
    </main>
  </body>
</html>
